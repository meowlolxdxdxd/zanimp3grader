<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZANIMP3GRADER</title>
<style>
*{box-sizing:border-box}
:root{--bg:#090a0d;--panel:#17191f;--line:#2d3037;--yellow:#ffd400;--green:#31ef8a}
body{margin:0;min-height:100vh;color:#eee;background:
radial-gradient(ellipse at 50% 45%,#1b1d21 0%,#0d0e11 48%,#08090b 100%);
font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.12;
background-image:radial-gradient(#fff .45px,transparent .45px);background-size:5px 5px}
.top{height:125px;display:flex;align-items:center;justify-content:center}
.logo{font-size:30px;font-weight:900;letter-spacing:-1px}
.logo b{color:#f1c800}
.logo:before{content:"";display:inline-block;width:34px;height:34px;margin-right:13px;vertical-align:-7px;
background:linear-gradient(135deg,#ffe329,#a88400);
clip-path:polygon(50% 0,100% 35%,100% 61%,50% 27%,0 61%,0 35%)}
.tools{position:absolute;left:75px;top:96px;display:flex;gap:16px;align-items:center;color:#bfc1c6;font-size:22px}
#bolt{border:0;background:none;color:#ffd400;font-size:25px;cursor:pointer;padding:0}
#bolt.active{filter:drop-shadow(0 0 8px #ffd400)}
.layout{display:grid;grid-template-columns:minmax(360px,1fr) 500px minmax(360px,1fr);
gap:48px;align-items:center;padding:17px 72px 38px}
.card{height:462px;border:1px solid #20232a;border-radius:16px;background:linear-gradient(145deg,#191b21,#14161b);
box-shadow:0 18px 40px #0008;padding:33px 38px;text-align:center}
.card h2{font-size:18px;margin:0 0 9px;font-weight:800}
.sub{font-size:13px;color:#999;margin-bottom:25px}
.number{height:265px;background:#0d0e10;display:flex;align-items:center;justify-content:center;
font-size:154px;font-weight:900;letter-spacing:-13px;text-shadow:3px 3px 0 #000}
.red{color:#ed0909}.white{color:#f5f5f5}
.side{font-size:20px;font-weight:800;color:#bfc1c5;margin-top:31px}
.side.left:before{content:"←";font-size:31px;margin-right:14px;vertical-align:-3px}
.side.right:after{content:"→";font-size:31px;margin-left:14px;vertical-align:-3px}
.center{display:flex;flex-direction:column;align-items:center}
.dial{width:430px;height:430px;border-radius:50%;position:relative;
background:radial-gradient(circle,#17191d 0 54%,#0f1013 55% 60%,transparent 61%),
repeating-conic-gradient(from 0deg,#35383e 0deg 1deg,transparent 1deg 10deg);
box-shadow:0 0 0 8px #101114,0 0 0 10px #30333a,0 0 0 19px #0c0d10}
.dial:before{content:"";position:absolute;inset:43px;border-radius:50%;border:12px solid #272a30;
box-shadow:inset 0 0 0 2px #0a0b0d}
.dial:after{content:"";position:absolute;inset:65px;border-radius:50%;border:2px solid #202329}
.chevrons{position:absolute;inset:0;display:grid;place-items:center;z-index:2}
.chevrons:before,.chevrons:after{content:"";position:absolute;width:92px;height:55px;
clip-path:polygon(50% 0,100% 45%,100% 100%,50% 55%,0 100%,0 45%)}
.chevrons:before{transform:translateY(-24px);background:#55585d}
.chevrons:after{transform:translateY(30px);background:#55585d}
.pointer-orbit{position:absolute;inset:0;z-index:4;transform:rotate(0deg);transform-origin:center}
.pointer{position:absolute;left:50%;top:3px;width:0;height:0;transform:translateX(-50%);
border-left:14px solid transparent;border-right:14px solid transparent;border-bottom:54px solid #ffd400;
filter:drop-shadow(0 0 6px #ffd400)}
.pointer:after{content:"";position:absolute;left:-7px;top:43px;width:14px;height:14px;border-radius:50%;background:#ffd400}
.result{width:430px;min-height:69px;margin-top:39px;border:2px solid #27d879;border-radius:16px;
display:flex;align-items:center;justify-content:center;gap:14px;font-size:20px;font-weight:900;
background:#101b16;opacity:0;transform:translateY(5px);transition:.25s}
.result.show{opacity:1;transform:translateY(0)}
.result .check{width:27px;height:27px;border-radius:50%;background:#3cf18d;color:#0b2115;
display:grid;place-items:center;font-size:19px}
.result .winner{color:#35ee88}
#spin{margin-top:27px;width:445px;height:78px;border:0;border-radius:15px;background:#e6c100;
color:#1c1c18;font-size:25px;font-weight:900;cursor:pointer;box-shadow:0 5px 0 #9c8500}
#spin:hover{background:#ffd51b}
#spin:active{transform:translateY(4px);box-shadow:0 1px 0 #9c8500}
#spin:disabled{opacity:.75;cursor:wait}
@media(max-width:1250px){.layout{grid-template-columns:1fr;max-width:600px;margin:auto;gap:28px}.center{order:-1}.tools{left:20px}.card{height:auto}.dial{width:360px;height:360px}.result,#spin{width:360px}}
</style>
</head>
<body>
<header class="top">
  <div class="logo">ZANI<b>MP3</b>GRADER</div>
  <div class="tools"><span>⚙</span><span>◖</span><button id="bolt" title="Ускорение">⚡</button></div>
</header>

<main class="layout">
<section class="card">
  <h2>Выберите предметы и/или баланс для использования</h2>
  <div class="sub">Вы можете выбрать несколько предметов</div>
  <div class="number red">90</div>
  <div class="side left">Левая сторона</div>
</section>

<section class="center">
  <div class="dial">
    <div class="pointer-orbit" id="orbit"><div class="pointer"></div></div>
    <div class="chevrons"></div>
  </div>
  <div class="result" id="result"><span class="check">✓</span><span id="resultText"></span></div>
  <button id="spin">⌃ &nbsp; Прокачать</button>
</section>

<section class="card">
  <h2>Выберите предмет для апгрейда</h2>
  <div class="sub">&nbsp;</div>
  <div class="number white">30</div>
  <div class="side right">Правая сторона</div>
</section>
</main>

<script>
const orbit=document.getElementById('orbit');
const spin=document.getElementById('spin');
const bolt=document.getElementById('bolt');
const resultBox=document.getElementById('result');
const resultText=document.getElementById('resultText');
let turbo=false, busy=false;

bolt.onclick=()=>{turbo=!turbo;bolt.classList.toggle('active',turbo)};
spin.onclick=()=>{
 if(busy)return;
 busy=true;spin.disabled=true;resultBox.classList.remove('show');
 const left=Math.random()<.5;
 const winner=left?'ЛЕВАЯ':'ПРАВАЯ';
 const value=left?'90':'30';
 const duration=turbo?1800:6500;
 const turns=turbo?5:8;
 const stopAngle=left?25:205;
 orbit.style.transition=`transform ${duration}ms cubic-bezier(.12,.75,.15,1)`;
 orbit.style.transform=`rotate(${turns*360+stopAngle}deg)`;
 setTimeout(()=>{
   resultText.innerHTML=`ВЫИГРАЛА <span class="winner">${winner}</span> СТОРОНА!`;
   resultBox.classList.add('show');
   spin.disabled=false;busy=false;
 },duration+100);
};
</script>
</body>
</html>
